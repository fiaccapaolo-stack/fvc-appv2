<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151C"><title>Catalogo — FVC Project</title><link rel="manifest" href="manifest.json"><link rel="icon" href="/icon-192.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"><style>
:root{--bg:#10151C;--surface:#1A222C;--surface-alt:#212B37;--border:#2B3644;--text:#EDF1F5;--text-dim:#8B98A8;--gold:#D4AF37;--gold-soft:#E8CE7A;--cyan:#4FD8E8;--radius:16px;--font-display:Space Grotesk,system-ui,sans-serif;--font-body:Inter,system-ui,sans-serif;--font-mono:IBM Plex Mono,SFMono-Regular,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);padding:20px 18px 50px}a{color:inherit}.wrap{max-width:760px;margin:auto}.top{display:flex;align-items:center;gap:10px;margin-bottom:22px}.back{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 12px;text-decoration:none;color:var(--text)}h1,h2{font-family:var(--font-display);margin:0}.eyebrow{font:11px var(--font-mono);color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px}.sub{color:var(--text-dim);font-size:13px;margin:8px 0 20px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{flex:0 0 auto;border:1px solid var(--border);background:transparent;color:var(--text-dim);border-radius:999px;padding:9px 14px;cursor:pointer}.tab.active{background:var(--gold);border-color:var(--gold);color:#141821;font-weight:700}.search{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-decoration:none;display:flex;flex-direction:column;gap:9px;min-height:240px}.thumb{height:150px;background:linear-gradient(135deg,var(--surface-alt),#26313f);border-radius:11px;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.card h3{font-size:14px;margin:0;line-height:1.3}.spec{font:11px var(--font-mono);color:var(--text-dim);margin:0}.price{font:600 14px var(--font-mono);color:var(--gold-soft);margin-top:auto}.rate{font:10.5px var(--font-mono);color:var(--cyan)}.empty{padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-dim);font-size:13px}@media(max-width:500px){.card{min-height:220px}.thumb{height:125px}}
</style></head><body><main class="wrap"><div class="top"><a class="back" href="index.html">← Home</a><div><p class="eyebrow">FVC Project</p><h1 id="title">Catalogo</h1></div></div><p class="sub" id="subtitle"></p><div class="tabs"><button class="tab" data-cat="smartphone">Smartphone</button><button class="tab" data-cat="accessori">Accessori</button><button class="tab" data-cat="ricambi">Ricambi</button></div><input id="search" class="search" type="search" placeholder="Cerca marca o modello..." autocomplete="off"><div id="grid" class="grid"></div></main><script>
let products=[];const params=new URLSearchParams(location.search);let cat=params.get('cat')||'smartphone';const $=id=>document.getElementById(id);const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function categoryOf(p){const v=String(p.category||p.cat||p.type||'').toLowerCase();if(['accessori','accessory','accessories'].includes(v))return'accessori';if(['ricambi','repair','spare'].includes(v))return'ricambi';return'smartphone'}function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));const q=norm($('search').value);const list=products.map((p,i)=>({p,i})).filter(x=>categoryOf(x.p)===cat).filter(x=>!q||norm(x.p.name).includes(q)||norm(x.p.brand).includes(q)||norm(x.p.spec).includes(q));$('title').textContent=cat==='smartphone'?'Smartphone':cat==='accessori'?'Accessori':'Ricambi';$('subtitle').textContent=list.length?`${list.length} elementi disponibili`:'Nessun elemento caricato';$('grid').innerHTML=list.length?list.map(x=>`<a class="card" href="dettaglio.html?kind=product&cat=${encodeURIComponent(cat)}&i=${x.i}"><div class="thumb">${x.p.image?`<img src="${x.p.image}" alt="${esc(x.p.name)}">`:'<span style="color:var(--cyan);font-size:28px">▣</span>'}</div><h3>${esc(x.p.name)}</h3><p class="spec">${esc(x.p.brand||'')}${x.p.spec?' · '+esc(x.p.spec):''}</p>${x.p.installments?.length?`<div class="rate">A rate · ${esc(x.p.installments[0].months||'')} · ${esc(x.p.installments[0].amount||'')}</div>`:''}<div class="price">${esc(x.p.price||'Prezzo in negozio')}</div></a>`).join(''):'<div class="empty">Nessun prodotto presente in questa categoria al momento.</div>'}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{cat=b.dataset.cat;history.replaceState(null,'',`catalogo.html?cat=${cat}`);$('search').value='';render()}));$('search').addEventListener('input',render);fetch('/api/config').then(r=>{if(!r.ok)throw Error();return r.json()}).then(c=>{products=Array.isArray(c.products)?c.products:[];render()}).catch(()=>{$('grid').innerHTML='<div class="empty">Impossibile caricare il catalogo. Riprova tra poco.</div>'});
</script></body></html>
