<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10151C">
  <title>Catalogo — FVC Project</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    :root{
      --bg:#10151C;
      --surface:#1A222C;
      --surface-alt:#212B37;
      --border:#2B3644;
      --text:#EDF1F5;
      --text-dim:#8B98A8;
      --gold:#D4AF37;
      --gold-soft:#E8CE7A;
      --cyan:#4FD8E8;
      --radius:16px;
      --font-display:Space Grotesk,system-ui,sans-serif;
      --font-body:Inter,system-ui,sans-serif;
      --font-mono:IBM Plex Mono,SFMono-Regular,monospace;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);padding:20px 18px 50px}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:760px;margin:auto}
    .top{display:flex;align-items:center;gap:10px;margin-bottom:22px}
    .back{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 12px;color:var(--text)}
    h1,h2{font-family:var(--font-display);margin:0}
    .eyebrow{font:11px var(--font-mono);color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px}
    .sub{color:var(--text-dim);font-size:13px;margin:8px 0 20px}
    .tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px;white-space:nowrap}
    .tab{flex:0 0 auto;border:1px solid var(--border);background:transparent;color:var(--text-dim);border-radius:999px;padding:9px 14px;cursor:pointer;font:inherit}
    .tab.active{background:var(--gold);border-color:var(--gold);color:#141821;font-weight:700}
    .search{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;margin-bottom:16px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-decoration:none;display:flex;flex-direction:column;gap:9px;min-height:240px}
    .thumb{height:150px;background:linear-gradient(135deg,var(--surface-alt),#26313f);border-radius:11px;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .thumb img{width:100%;height:100%;object-fit:cover}
    .card h3{font-size:14px;margin:0;line-height:1.3}
    .spec{font:11px var(--font-mono);color:var(--text-dim);margin:0}
    .price{font:600 14px var(--font-mono);color:var(--gold-soft);margin-top:auto}
    .rate{font:10.5px var(--font-mono);color:var(--cyan)}
    .empty{padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-dim);font-size:13px}
    .offer-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);min-height:110px}
    .offer-pct{min-width:62px;text-align:center;font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--gold)}
    .offer-body{flex:1}
    .offer-body h3{margin:0 0 4px;font-size:14px;line-height:1.3}
    .offer-body p{margin:0;color:var(--text-dim);font-size:12px;line-height:1.4}
    .offer-arrow{color:var(--gold-soft);font-size:22px}
    .plan-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);min-height:110px}
    .plan-badge{padding:6px 8px;border-radius:999px;background:var(--surface-alt);color:var(--cyan);font:10px var(--font-mono);text-transform:uppercase;letter-spacing:.06em}
    .plan-body{flex:1}
    .plan-body h3{margin:0 0 4px;font-size:14px;line-height:1.3}
    .plan-body p{margin:0;color:var(--text-dim);font-size:12px;line-height:1.4}
    .plan-price{font:600 14px var(--font-mono);color:var(--gold-soft);white-space:nowrap}
    @media(max-width:500px){.grid{grid-template-columns:1fr}.card{min-height:220px}.thumb{height:125px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <a class="back" href="index.html">← Home</a>
      <div>
        <p class="eyebrow">FVC Project</p>
        <h1 id="title">Catalogo</h1>
      </div>
    </div>
    <p class="sub" id="subtitle"></p>
    <div class="tabs">
      <button class="tab" data-cat="smartphone">Smartphone</button>
      <button class="tab" data-cat="accessori">Accessori</button>
      <button class="tab" data-cat="telefonia">Telefonia</button>
      <button class="tab" data-cat="offerte">Offerte</button>
    </div>
    <input id="search" class="search" type="search" placeholder="Cerca marca o modello..." autocomplete="off">
    <div id="grid" class="grid"></div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    let currentCat = params.get("cat") || "smartphone";
    const selectedCarrier = (params.get("carrier") || "").toLowerCase();
    let products = [];
    let offers = [];
    let plans = [];
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>\"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
    const normalize = (value) => String(value || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    function categoryOf(item) {
      const raw = String(item && (item.category || item.cat || item.type || "")).toLowerCase();
      if (["accessori", "accessory", "accessories"].includes(raw)) return "accessori";
      return "smartphone";
    }
    function renderProducts(list) {
      const q = normalize($("search").value.trim());
      if (currentCat === "offerte") {
        const filtered = list.filter((offer) => {
          if (!q) return true;
          const haystack = normalize(`${offer.title || ""} ${offer.description || offer.desc || ""}`);
          return haystack.includes(q);
        });
        $("title").textContent = "Offerte";
        $("subtitle").textContent = filtered.length ? `${filtered.length} offerte disponibili` : "Nessuna offerta disponibile.";
        $("grid").innerHTML = filtered.length
          ? filtered.map((offer) => `
            <a class="offer-card" href="dettaglio.html?kind=offer&id=${encodeURIComponent(offer.id || offer.title || Math.random())}">
              <div class="offer-pct">${escapeHtml(offer.pct || "Off")}</div>
              <div class="offer-body">
                <h3>${escapeHtml(offer.title || "Offerta")}</h3>
                <p>${escapeHtml(offer.description ?? offer.desc ?? "Promozione in corso")}</p>
              </div>
              <div class="offer-arrow">›</div>
            </a>
          `).join("")
          : '<div class="empty">Nessuna offerta disponibile al momento.</div>';
        return;
      }

      if (currentCat === "telefonia") {
        const sourcePlans = Array.isArray(list) ? list : [];
        const filtered = sourcePlans.filter((plan) => {
          const carrierName = String(plan.carrier || plan.operator || "").toLowerCase();
          const matchCarrier = !selectedCarrier || carrierName.includes(selectedCarrier);
          if (!matchCarrier) return false;
          if (!q) return true;
          const haystack = normalize(`${plan.name || ""} ${plan.carrier || ""} ${plan.type || ""} ${plan.details || ""}`);
          return haystack.includes(q);
        });
        $("title").textContent = "Telefonia & Fibra";
        $("subtitle").textContent = filtered.length ? `${filtered.length} offerte disponibili` : "Nessuna offerta di telefonia e fibra.";
        $("grid").innerHTML = filtered.length
          ? filtered.map((plan) => `
            <a class="plan-card" href="dettaglio.html?kind=plan&name=${encodeURIComponent(plan.name || "")}">
              <span class="plan-badge">${escapeHtml(plan.type || "mobile")}</span>
              <div class="plan-body">
                <h3>${escapeHtml(plan.name || "Piano")}</h3>
                <p>${escapeHtml(plan.carrier || "")}${plan.details ? " · " + escapeHtml(plan.details) : ""}</p>
              </div>
              <span class="plan-price">${escapeHtml(plan.price || "")}</span>
            </a>
          `).join("")
          : '<div class="empty">Nessuna offerta di telefonia e fibra disponibile al momento.</div>';
        return;
      }

      const filtered = list.filter((item) => {
        return categoryOf(item) === currentCat;
      }).filter((item) => {
        if (!q) return true;
        const haystack = normalize(`${item.name || ""} ${item.brand || ""} ${item.spec || ""} ${item.model || ""}`);
        return haystack.includes(q);
      });
      const titleMap = {smartphone:"Smartphone", accessori:"Accessori", telefonia:"Telefonia & Fibra"};
      $("title").textContent = titleMap[currentCat] || "Catalogo";
      $("subtitle").textContent = filtered.length ? `${filtered.length} elementi disponibili` : "Nessun elemento presente in questa categoria.";
      $("grid").innerHTML = filtered.length
        ? filtered.map((item, index) => `
          <a class="card" href="dettaglio.html?kind=product&cat=${encodeURIComponent(currentCat)}&i=${index}">
            <div class="thumb">${item.image ? `<img src="${item.image}" alt="${escapeHtml(item.name)}">` : `<span style="color:var(--cyan);font-size:28px">▣</span>`}</div>
            <h3>${escapeHtml(item.name || "Prodotto")}</h3>
            <p class="spec">${escapeHtml(item.brand || "")}${item.spec ? " · " + escapeHtml(item.spec) : ""}</p>
            ${item.installments && item.installments.length ? `<div class="rate">A rate · ${escapeHtml(item.installments[0].months || "")} · ${escapeHtml(item.installments[0].amount || "")}</div>` : ""}
            <div class="price">${escapeHtml(item.price || "Prezzo in negozio")}</div>
          </a>
        `).join("")
        : '<div class="empty">Nessun prodotto presente in questa categoria al momento.</div>';
    }
    function syncTabSelection() {
      document.querySelectorAll(".tab[data-cat]").forEach((button) => {
        button.classList.toggle("active", button.dataset.cat === currentCat);
      });
    }
    function bindTabs() {
      document.querySelectorAll(".tab[data-cat]").forEach((button) => {
        button.addEventListener("click", () => {
          currentCat = button.dataset.cat;
          const carrierQuery = selectedCarrier ? `&carrier=${encodeURIComponent(selectedCarrier)}` : "";
          history.replaceState(null, "", `catalogo.html?cat=${currentCat}${carrierQuery}`);
          $("search").value = "";
          syncTabSelection();
          renderProducts(currentCat === "offerte" ? offers : (currentCat === "telefonia" ? plans : products));
        });
      });
      syncTabSelection();
    }
    $("search").addEventListener("input", () => {
      renderProducts(currentCat === "offerte" ? offers : (currentCat === "telefonia" ? plans : products));
    });
    fetch("/api/config")
      .then((res) => res.ok ? res.json() : Promise.reject())
      .then((config) => {
        products = Array.isArray(config.products) ? config.products : [];
        offers = Array.isArray(config.offers) ? config.offers : [];
        plans = Array.isArray(config.plans) ? config.plans : [];
        bindTabs();
        renderProducts(currentCat === "offerte" ? offers : (currentCat === "telefonia" ? plans : products));
      })
      .catch(() => {
        $("grid").innerHTML = '<div class="empty">Impossibile caricare il catalogo. Riprova più tardi.</div>';
        $("subtitle").textContent = "Errore di caricamento";
      });
  </script>
</body>
</html>
