<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151C"><title>Dettaglio — FVC Project</title><link rel="manifest" href="manifest.json"><link rel="icon" href="/icon-192.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"><style>
:root{--bg:#10151C;--surface:#1A222C;--surface-alt:#212B37;--border:#2B3644;--text:#EDF1F5;--text-dim:#8B98A8;--gold:#D4AF37;--gold-soft:#E8CE7A;--cyan:#4FD8E8;--radius:16px;--font-display:Space Grotesk,system-ui,sans-serif;--font-body:Inter,system-ui,sans-serif;--font-mono:IBM Plex Mono,SFMono-Regular,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);padding:20px 18px 50px}a{color:inherit}.wrap{max-width:760px;margin:auto}.top{display:flex;align-items:center;gap:10px;margin-bottom:22px}.back{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 12px;text-decoration:none;color:var(--text)}h1,h2{font-family:var(--font-display);margin:0}.eyebrow{font:11px var(--font-mono);color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px}.sub{color:var(--text-dim);font-size:13px;margin:8px 0 20px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{flex:0 0 auto;border:1px solid var(--border);background:transparent;color:var(--text-dim);border-radius:999px;padding:9px 14px;cursor:pointer}.tab.active{background:var(--gold);border-color:var(--gold);color:#141821;font-weight:700}.search{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-decoration:none;display:flex;flex-direction:column;gap:9px;min-height:240px}.thumb{height:150px;background:linear-gradient(135deg,var(--surface-alt),#26313f);border-radius:11px;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.card h3{font-size:14px;margin:0;line-height:1.3}.spec{font:11px var(--font-mono);color:var(--text-dim);margin:0}.price{font:600 14px var(--font-mono);color:var(--gold-soft);margin-top:auto}.rate{font:10.5px var(--font-mono);color:var(--cyan)}.empty{padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-dim);font-size:13px}@media(max-width:500px){.card{min-height:220px}.thumb{height:125px}}
 .detail{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px}.heroimg{width:100%;max-height:360px;object-fit:contain;background:var(--surface-alt);border-radius:14px;margin-bottom:18px}.detail h2{font-size:26px;margin-bottom:7px}.muted{color:var(--text-dim);font-size:13px;line-height:1.5}.pricebig{font:600 25px var(--font-mono);color:var(--gold-soft);margin:18px 0}.ratebox,.info{background:var(--surface-alt);border-radius:11px;padding:12px;margin-top:9px}.ratebox{display:flex;justify-content:space-between;gap:12px}.ratebox b{color:var(--cyan);font-family:var(--font-mono)}.tag{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:5px 9px;color:var(--gold);font:10px var(--font-mono);text-transform:uppercase}.actions{display:flex;gap:9px;margin-top:20px}.actions a{flex:1;text-align:center;padding:11px;border-radius:10px;text-decoration:none;background:var(--gold);color:#141821;font-weight:700}.actions a.secondary{background:transparent;color:var(--text);border:1px solid var(--border)}</style></head><body><main class="wrap"><div class="top"><a class="back" href="javascript:history.back()">← Indietro</a><div><p class="eyebrow">FVC Project</p><h1>Dettaglio</h1></div></div><div id="detail" class="detail"><p class="muted">Caricamento...</p></div></main><script>
const pms=new URLSearchParams(location.search),kind=pms.get('kind')||'product',idx=Number(pms.get('i')),cat=pms.get('cat')||'smartphone',id=pms.get('id'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function productCategory(p){const v=String(p.category||p.cat||p.type||'').toLowerCase();if(['accessori','accessory','accessories'].includes(v))return'accessori';if(['ricambi','repair','spare'].includes(v))return'ricambi';return'smartphone'}function renderProduct(p){$('detail').innerHTML=`${p.image?`<img class="heroimg" src="${p.image}" alt="${esc(p.name)}">`:''}<span class="tag">${esc(p.brand||productCategory(p))}</span><h2>${esc(p.name||'Prodotto')}</h2><p class="muted">${esc(p.spec||'')}</p><div class="pricebig">${esc(p.price||'Prezzo in negozio')}</div>${p.installments?.length?`<h3>Rate disponibili</h3>${p.installments.map(r=>`<div class="ratebox"><span>${esc(r.months||'Rate')}</span><b>${esc(r.amount||'')}</b></div>`).join('')}`:''}<div class="info">Disponibilità: <strong>${esc(p.stock||'da verificare in negozio')}</strong></div><div class="actions"><a href="index.html">Home</a><a class="secondary" href="catalogo.html?cat=${encodeURIComponent(productCategory(p))}">Torna al catalogo</a></div>`}function renderPlan(p){$('detail').innerHTML=`${p.image?`<img class="heroimg" src="${p.image}" alt="${esc(p.name)}">`:''}<span class="tag">${esc(p.type||'mobile')}</span><h2>${esc(p.name||'Offerta')}</h2><p class="muted">${esc(p.details||'')}</p><div class="pricebig">${esc(p.price||'Prezzo in negozio')}</div><div class="actions"><a href="index.html">Home</a><a class="secondary" href="offerte.html">Torna alle offerte</a></div>`}function renderOffer(p){$('detail').innerHTML=`<span class="tag">Promozione</span><h2>${esc(p.title||'Offerta')}</h2><p class="muted">${esc(p.description??p.desc??'')}</p><div class="pricebig">${esc(p.pct||'')}</div><div class="actions"><a href="index.html">Home</a><a class="secondary" href="offerte.html">Torna alle offerte</a></div>`}fetch('/api/config').then(r=>{if(!r.ok)throw Error();return r.json()}).then(c=>{if(kind==='product'){const arr=Array.isArray(c.products)?c.products:[];const p=arr[idx];if(!p||productCategory(p)!==cat)return Promise.reject();renderProduct(p)}else if(kind==='plan'){const arr=Array.isArray(c.plans)?c.plans:[];if(!arr[idx])return Promise.reject();renderPlan(arr[idx])}else{const arr=Array.isArray(c.offers)?c.offers:[],p=arr.find(o=>String(o.id)===String(id));if(!p)return Promise.reject();renderOffer(p)}}).catch(()=>{$('detail').innerHTML='<p class="muted">Dettaglio non disponibile.</p>'});
</script></body></html>
