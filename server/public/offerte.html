<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151C"><title>Offerte — FVC Project</title><link rel="manifest" href="manifest.json"><link rel="icon" href="/icon-192.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"><style>
:root{--bg:#10151C;--surface:#1A222C;--surface-alt:#212B37;--border:#2B3644;--text:#EDF1F5;--text-dim:#8B98A8;--gold:#D4AF37;--gold-soft:#E8CE7A;--cyan:#4FD8E8;--radius:16px;--font-display:Space Grotesk,system-ui,sans-serif;--font-body:Inter,system-ui,sans-serif;--font-mono:IBM Plex Mono,SFMono-Regular,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);padding:20px 18px 50px}a{color:inherit}.wrap{max-width:760px;margin:auto}.top{display:flex;align-items:center;gap:10px;margin-bottom:22px}.back{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 12px;text-decoration:none;color:var(--text)}h1,h2{font-family:var(--font-display);margin:0}.eyebrow{font:11px var(--font-mono);color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px}.sub{color:var(--text-dim);font-size:13px;margin:8px 0 20px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{flex:0 0 auto;border:1px solid var(--border);background:transparent;color:var(--text-dim);border-radius:999px;padding:9px 14px;cursor:pointer}.tab.active{background:var(--gold);border-color:var(--gold);color:#141821;font-weight:700}.search{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-decoration:none;display:flex;flex-direction:column;gap:9px;min-height:240px}.thumb{height:150px;background:linear-gradient(135deg,var(--surface-alt),#26313f);border-radius:11px;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.card h3{font-size:14px;margin:0;line-height:1.3}.spec{font:11px var(--font-mono);color:var(--text-dim);margin:0}.price{font:600 14px var(--font-mono);color:var(--gold-soft);margin-top:auto}.rate{font:10.5px var(--font-mono);color:var(--cyan)}.empty{padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-dim);font-size:13px}@media(max-width:500px){.card{min-height:220px}.thumb{height:125px}}
 .section{margin-bottom:26px}.section h2{font-size:21px;margin-bottom:12px}.offer{display:flex;gap:13px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;text-decoration:none}.pct{font:700 22px var(--font-display);color:var(--gold);width:58px;text-align:center}.body{flex:1}.body h3{font-size:14px;margin:0 0 4px}.body p{font-size:12px;color:var(--text-dim);margin:0;line-height:1.4}.plan{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;text-decoration:none}.badge{font:10px var(--font-mono);padding:5px 8px;border-radius:999px;background:var(--surface-alt);color:var(--cyan);white-space:nowrap}.plan .body{flex:1}.plan h3{font-size:14px;margin:0 0 3px}.price{font:600 14px var(--font-mono);color:var(--gold-soft);white-space:nowrap}</style></head><body><main class="wrap"><div class="top"><a class="back" href="index.html">← Home</a><div><p class="eyebrow">FVC Project</p><h1>Offerte</h1></div></div><p class="sub">Promozioni, offerte mobile e fibra disponibili nel catalogo.</p><section class="section"><h2>Promozioni</h2><div id="promos"></div></section><section class="section"><h2>Mobile & Fibra</h2><div id="plans"></div></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function empty(t){return `<div class="empty">${t}</div>`}fetch('/api/config').then(r=>{if(!r.ok)throw Error();return r.json()}).then(c=>{const o=Array.isArray(c.offers)?c.offers:[],p=Array.isArray(c.plans)?c.plans:[];$('promos').innerHTML=o.length?o.map(x=>`<a class="offer" href="dettaglio.html?kind=offer&id=${encodeURIComponent(x.id)}"><div class="pct">${esc(x.pct||'')}</div><div class="body"><h3>${esc(x.title)}</h3><p>${esc(x.description??x.desc??'')}</p></div><span>›</span></a>`).join(''):empty('Nessuna promozione disponibile al momento.');$('plans').innerHTML=p.length?p.map((x,i)=>`<a class="plan" href="dettaglio.html?kind=plan&i=${i}"><span class="badge">${esc(x.type||'mobile')}</span><div class="body"><h3>${esc(x.name)}</h3><p>${esc(x.carrier||'')} · ${esc(x.details||'')}</p></div><span class="price">${esc(x.price||'')}</span></a>`).join(''):empty('Nessuna offerta mobile/fibra disponibile al momento.')}).catch(()=>{const e=empty('Impossibile caricare le offerte. Riprova tra poco.');$('promos').innerHTML=e;$('plans').innerHTML=e});
</script></body></html>
