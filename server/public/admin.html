<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin FVC Project</title>
</head>
<body>
  <h2>## Smartphone</h2>

  <button type="button" id="add-smartphone">+ Nuovo smartphone</button>

  <div id="smartphone-list"></div>

  <button type="button" id="save-catalog">Salva catalogo definitivamente</button>
  <button type="button" id="save-and-notify">Salva definitivamente + notifica</button>

  <script>
    const ADMIN_PASSWORD = prompt('Password admin');

    function getHeaders() {
      return {
        'Content-Type': 'application/json',
        'x-admin-password': ADMIN_PASSWORD || ''
      };
    }

    async function fetchConfig() {
      const res = await fetch('/api/admin/config', {
        headers: getHeaders()
      });

      const text = await res.text();
      if (!res.ok) {
        throw new Error('Password admin non valida');
      }
      try {
        return JSON.parse(text);
      } catch {
        return {};
      }
    }

    async function saveCatalog(sendNotification) {
      if (!ADMIN_PASSWORD) {
        alert('Password admin obbligatoria');
        return;
      }

      try {
        const current = await fetchConfig();
        const payload = {
          shopName: current.shopName || 'Fvc Project Srl',
          address: current.address || '',
          phone: current.phone || '',
          whatsapp: current.whatsapp || '',
          products: Array.isArray(current.products) ? current.products : [],
          plans: Array.isArray(current.plans) ? current.plans : [],
          news: Array.isArray(current.news) ? current.news : [],
          ...(sendNotification ? {
            notify: {
              title: 'Fvc Project · Novità',
              body: 'Nuovo articolo disponibile nel catalogo.'
            }
          } : {})
        };

        const res = await fetch('/api/admin/config', {
          method: 'PUT',
          headers: getHeaders(),
          body: JSON.stringify(payload)
        });

        const text = await res.text();
        if (!res.ok) {
          throw new Error(text || 'Errore salvataggio');
        }

        alert(sendNotification ? 'Catalogo salvato e notifica inviata' : 'Catalogo salvato');
      } catch (err) {
        console.error(err);
        alert(err.message || 'Errore durante il salvataggio');
      }
    }

    document.getElementById('save-catalog').addEventListener('click', () => saveCatalog(false));
    document.getElementById('save-and-notify').addEventListener('click', () => saveCatalog(true));

    document.getElementById('add-smartphone').addEventListener('click', async () => {
      try {
        const current = await fetchConfig();
        const products = Array.isArray(current.products) ? current.products : [];
        products.push({
          name: 'Nuovo Smartphone',
          spec: 'Specifica da aggiornare',
          price: '€ 0',
          stock: 1,
          image: ''
        });

        const payload = {
          shopName: current.shopName || 'Fvc Project Srl',
          address: current.address || '',
          phone: current.phone || '',
          whatsapp: current.whatsapp || '',
          products,
          plans: Array.isArray(current.plans) ? current.plans : [],
          news: Array.isArray(current.news) ? current.news : []
        };

        const res = await fetch('/api/admin/config', {
          method: 'PUT',
          headers: getHeaders(),
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          throw new Error('Salvataggio non riuscito');
        }

        const item = document.createElement('div');
        item.textContent = 'Nuovo Smartphone aggiunto';
        document.getElementById('smartphone-list').appendChild(item);
      } catch (err) {
        console.error(err);
        alert('Errore: controlla la password admin');
      }
    });
  </script>
</body>
</html>
