<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10151C">
  <title>Offerte operatore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#10151C; --surface:#1A222C; --surface-alt:#212B37; --border:#2B3644; --text:#EDF1F5; --text-dim:#8B98A8; --gold:#D4AF37; --gold-soft:#E8CE7A; --cyan:#4FD8E8; --radius:16px; --font-display:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif; --font-mono:'IBM Plex Mono',monospace;
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);padding:20px 18px 50px} a{color:inherit;text-decoration:none} main{max-width:760px;margin:auto}.top{display:flex;align-items:center;gap:10px;margin-bottom:22px}.back{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 12px;color:var(--text)} h1,h2{font-family:var(--font-display);margin:0}.eyebrow{font:11px var(--font-mono);color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px}.sub{color:var(--text-dim);font-size:13px;margin:8px 0 20px}.offers{display:grid;gap:12px}.offer{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;gap:14px;align-items:center}.pct{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--gold);min-width:60px;text-align:center}.body{flex:1}.body h3{margin:0 0 4px;font-size:14px}.body p{margin:0;color:var(--text-dim);font-size:12px;line-height:1.4}.arrow{color:var(--gold-soft);font-size:22px}.empty{padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-dim);font-size:13px}@media(max-width:500px){.offer{padding:12px}.pct{font-size:18px;min-width:48px}}</style>
</head>
<body>
  <main>
    <div class="top">
      <a class="back" href="index.html">← Home</a>
      <div>
        <p class="eyebrow">FVC Project</p>
        <h1 id="title">Offerte</h1>
      </div>
    </div>
    <p class="sub" id="subtitle">Piani disponibili per il gestore selezionato.</p>
    <div id="offers" class="offers"></div>
  </main>

  <script>
    const CARRIERS = {
      tim: [{ name: 'Tim Power Iron', type: 'mobile', price: '9,99€/mese', details: '150GB, minuti e SMS illimitati' }],
      wind: [{ name: 'WindTre Go Unlimited', type: 'mobile', price: '11,99€/mese', details: 'Giga illimitati, minuti illimitati' }],
      sky: [{ name: 'Sky Wifi', type: 'fibra', price: '29,95€/mese', details: 'Fibra fino a 1 Giga, modem incluso' }],
      lyca: [{ name: 'Lycamobile Italia 100', type: 'mobile', price: '7,99€/mese', details: '100GB, minuti illimitati' }],
      very: [{ name: 'VeryMobile 150GB', type: 'mobile', price: '5,99€/mese', details: '150GB, minuti illimitati' }],
      kena: [{ name: 'Kena 150GB', type: 'mobile', price: '7,99€/mese', details: '150GB, minuti illimitati' }]
    };
    const labels = { tim:'TIM', wind:'WindTre', sky:'Sky', lyca:'Lycamobile', very:'VeryMobile', kena:'Kena' };
    const params = new URLSearchParams(location.search);
    const carrier = params.get('carrier') || 'tim';
    const title = labels[carrier] || 'Operatore';
    document.getElementById('title').textContent = `Offerte ${title}`;
    document.getElementById('subtitle').textContent = `Piani attivi per ${title} disponibili in negozio.`;
    const offers = CARRIERS[carrier] || [];
    document.getElementById('offers').innerHTML = offers.length
      ? offers.map((plan, idx) => `
          <div class="offer">
            <div class="pct">${idx + 1}</div>
            <div class="body">
              <h3>${plan.name}</h3>
              <p>${plan.details}</p>
            </div>
            <div class="arrow">›</div>
          </div>
        `).join('')
      : '<div class="empty">Nessuna offerta disponibile al momento per questo operatore.</div>';
  </script>
</body>
</html>
